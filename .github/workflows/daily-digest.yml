yaml
name: Daily IT/Quality News Digest

on:
  schedule:
    # 매일 한국시간(KST) 오전 7시 = UTC 전날 22시
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write  # posted.json 변경사항을 다시 커밋하기 위해 필요

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 및 워드프레스 게시 실행
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/rss_to_wp.py

      - name: 게시 기록(posted.json) 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/posted.json
          git diff --staged --quiet || git commit -m "chore: update posted.json [skip ci]"
          git push
