# =============================================================================
# 뉴스 수집 소스 설정
# =============================================================================
# 두 가지 방식으로 피드를 등록할 수 있습니다.
#
# 1) keyword_feeds: 구글 뉴스 RSS 검색을 이용해 키워드로 국내 모든 언론사를
#    커버합니다. 별도 언론사 RSS 주소를 몰라도 되고 가장 안정적입니다.
#    (예: "IT 뉴스" 검색 -> 여러 언론사의 IT 관련 기사가 자동으로 모임)
#
# 2) direct_feeds: 특정 언론사/기관의 RSS 주소를 알고 있다면 여기에 직접
#    추가하세요. (예: TTA, ISO, 특정 매체 등)
#
# category 필드는 워드프레스에 올릴 때 대분류로 쓰입니다 (IT / 품질).
# label 필드는 게시글 안에서 보여줄 소제목입니다.
# max_items: 피드 하나당 하루에 가져올 최대 기사 수
# =============================================================================

keyword_feeds:
  - label: "IT 산업 뉴스"
    category: "IT"
    query: "IT 산업"
    max_items: 5

  - label: "인공지능(AI) 뉴스"
    category: "IT"
    query: "인공지능 AI 기술"
    max_items: 5

  - label: "소프트웨어 품질 뉴스"
    category: "품질"
    query: "소프트웨어 품질"
    max_items: 5

  - label: "IT 거버넌스 · 표준화 뉴스"
    category: "품질"
    query: "IT거버넌스 OR ISO표준 OR 소프트웨어표준"
    max_items: 5

  - label: "공공 IT · 디지털정부 뉴스"
    category: "IT"
    query: "공공 IT 디지털정부"
    max_items: 5

direct_feeds:
  # 예시 (필요하면 주석을 풀고 실제 주소로 교체하세요):
  # - label: "보안뉴스"
  #   category: "IT"
  #   url: "https://www.boannews.com/media/news_rss.xml"
  #   max_items: 5
  []
